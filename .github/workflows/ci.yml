name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Typecheck e testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configura o Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instala as dependencias
        run: npm ci

      - name: Verifica os tipos
        run: npm run typecheck

      - name: Roda os testes
        run: npm test

      - name: Avalia o detector de anomalias
        run: npm run eval:detector -- --seeds 50
